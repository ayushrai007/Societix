spring:
  application:
    name: societix
  config:
    # Local overrides from the repository-root .env (see .env.example); optional, so the
    # defaults below apply when it is absent. Real environments set environment variables.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:societix}
    username: ${DB_USER:societix}
    password: ${DB_PASSWORD:societix}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
