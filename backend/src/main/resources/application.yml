spring:
  application:
    name: societix
  config:
    # Local overrides from the repository-root .env (see .env.example); optional, so the
    # defaults below apply when it is absent. Real environments set environment variables.
    import: optional:file:../.env[.properties]
  datasource:
    # The application's runtime role: not a superuser, no BYPASSRLS, owns no tables, so the
    # tenant row-level security policies apply to every query the application makes.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/societix}
    username: ${SPRING_DATASOURCE_USERNAME:societix_app}

    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Versioned SQL migrations are applied automatically on application startup.
    locations: classpath:db/migration
    # Flyway connects to the same database as the schema owner role, not as the runtime role.
    user: ${SPRING_FLYWAY_USER:societix}
    password: ${SPRING_FLYWAY_PASSWORD}
    placeholders:
      # Role that the migrations grant table privileges to.
      app_runtime_role: ${spring.datasource.username}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

societix:
  security:
    # Keep disabled until SOC-11 checks current administrator status and token version per request.
    society-creation-enabled: ${SOCIETIX_SOCIETY_CREATION_ENABLED:false}
    firebase:
      # Required per environment: a missing project must fail startup instead of changing trust roots.
      project-id: ${FIREBASE_PROJECT_ID}
      jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
      auth-emulator-host: ${FIREBASE_AUTH_EMULATOR_HOST:}
      admin:
        enabled: ${FIREBASE_ADMIN_ENABLED:false}
    phone-encryption-key: ${SOCIETIX_PHONE_ENCRYPTION_KEY:}
    platform-admin:
      bootstrap:
        firebase-uid: ${SOCIETIX_PLATFORM_ADMIN_BOOTSTRAP_FIREBASE_UID:}
    rate-limit:
      onboarding-requests-per-ip-per-minute: ${SOCIETIX_ONBOARDING_REQUESTS_PER_IP_PER_MINUTE:60}
      membership-requests-per-user-per-hour: ${SOCIETIX_MEMBERSHIP_REQUESTS_PER_USER_PER_HOUR:5}
  outbox:
    poll-delay-ms: ${SOCIETIX_OUTBOX_POLL_DELAY_MS:3000}
    batch-size: ${SOCIETIX_OUTBOX_BATCH_SIZE:100}
