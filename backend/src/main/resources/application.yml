spring:
  application:
    name: societix
  config:
    # Local overrides from the repository-root .env (see .env.example); optional, so the
    # defaults below apply when it is absent. Real environments set environment variables.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/societix}
    username: ${SPRING_DATASOURCE_USERNAME:societix}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # Versioned SQL migrations are applied automatically on application startup.
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
